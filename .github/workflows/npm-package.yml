name: Build npm package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-14
            platform: darwin-arm64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - run: cargo test --locked
      - run: npm run build:native
      - run: npm test
      - run: npm run pack:local
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/
          if-no-files-found: error
  package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native/
          merge-multiple: true
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Pack all platforms
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
