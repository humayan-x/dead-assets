name: Bug report
description: Report incorrect scanning, cleanup, installation, or output.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md instead of posting details here. Use synthetic files and remove private data."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include dead-assets --version and whether you installed through npm or Cargo.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node version (npm users), framework, and relevant ignore rules.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact command, small directory layout, and source/reference snippets. Reproduce with --dry-run when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output or errors.
    validations:
      required: true
